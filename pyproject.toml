[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nivara"
version = "1.0.0"
description = "Privacy-first, explainable AI mental-health screening and student support platform"
authors = [
    {name = "Nivara Research & Engineering Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "scipy>=1.11.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.28.0",
    "argon2-cffi>=23.1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "pyreadstat>=1.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nivara*"]
